[project]
name = "cameratrapml"
version = "1.0.0"
description = "Quantization in wildlife camera traps: memory, latency and accuracy trade-offs of FP32 -> 1-bit MobileNetV2/ResNet18 classifiers on ENA24"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ben Bush" }, { name = "Victoria Vanlue" }]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "psutil",
    "tqdm",
    "pillow",
    "gradio>=4.0",
    # gradio 4 (PytorchWildlife caps it below 5) breaks with newer versions of these:
    "huggingface_hub<1.0",
    "pydantic<2.11",
    "starlette<1.0",
]

[project.optional-dependencies]
# MegaDetector for the demo's detection stage (optional; the app falls back without it)
megadetector = [
    "PytorchWildlife>=1.3.1",
    "yolov5>=7.0",   # older yolov5 wheels are rejected by uv (duplicate zip entries)
    # imported by PytorchWildlife 1.3 but not declared as its dependencies:
    "soundfile",
    "librosa",
    "setuptools<81",   # bundled yolov5 still imports pkg_resources (removed in setuptools 81)
]
# rebuild the slides (scripts/make_slides.py)
docs = ["python-pptx", "qrcode[pil]"]
# run notebooks/results_walkthrough.ipynb locally
notebook = ["jupyterlab", "ipykernel"]

[tool.uv]
# This repo is a collection of scripts (run.py, result.py, src/), not an installable package.
package = false
